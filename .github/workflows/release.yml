# Construit ConcertCutter.exe et le publie, pour qu'un lien de téléchargement
# existe. C'est le point qui manquait : l'exécutable était produit sur la
# machine de développement, dans un dossier `dist/` que git ignore. Personne
# d'autre ne pouvait donc l'obtenir autrement qu'en installant Python.
#
# Deux déclencheurs, et pas de construction à chaque commit : l'exécutable pèse
# 27 Mo, et une version par correctif ne dirait rien à qui vient télécharger.
#
#   git tag v1.0 && git push origin v1.0   -> publie la version v1.0
#   onglet Actions > Run workflow          -> construit sans publier, pour voir
#
# La construction tourne sous Windows : PyInstaller ne croise pas les
# plateformes, un exécutable Windows se fabrique sous Windows.

name: Publier l'exécutable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # nécessaire pour créer la release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Vérifier l'interface web
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Vérifier les versions
        shell: pwsh
        run: |
          $pythonVersion = python -c "import concertcutter; print(concertcutter.__version__)"
          $webVersion = (Get-Content web\package.json | ConvertFrom-Json).version
          if ($pythonVersion -ne $webVersion) {
            throw "versions Python ($pythonVersion) et web ($webVersion) différentes"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(?<major>\d+)\.(?<minor>\d+)(?:\.(?<patch>\d+))?$') {
              throw "tag de release invalide : $env:GITHUB_REF_NAME"
            }
            $patch = if ($Matches.patch) { $Matches.patch } else { "0" }
            $tagVersion = "$($Matches.major).$($Matches.minor).$patch"
            if ($tagVersion -ne $pythonVersion) {
              throw "tag $env:GITHUB_REF_NAME différent de la version $pythonVersion"
            }
          }

      - name: Construire
        run: .\build_exe.bat

      # Un exécutable de quelques kilooctets serait le signe d'une construction
      # partie de travers, et la release paraîtrait pourtant réussie.
      - name: Vérifier le poids
        shell: pwsh
        run: |
          $exe = Get-Item dist\ConcertCutter.exe
          "{0:N1} Mo" -f ($exe.Length / 1MB)
          if ($exe.Length -lt 15MB) { throw "executable trop petit : construction incomplete" }

      - name: Produire l'empreinte SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\ConcertCutter.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ConcertCutter.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      # Disponible même sans publication : c'est ce qui rend le déclenchement
      # manuel utile, on récupère l'exécutable dans l'onglet Actions.
      - uses: actions/upload-artifact@v4
        with:
          name: ConcertCutter-release
          path: |
            dist/ConcertCutter.exe
            dist/SHA256SUMS.txt

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ConcertCutter.exe
            dist/SHA256SUMS.txt
          # Le nom du fichier attaché ne changeant pas d'une version à l'autre,
          # le lien .../releases/latest/download/ConcertCutter.exe du README
          # reste valable sans être réécrit à chaque publication.
          generate_release_notes: true
